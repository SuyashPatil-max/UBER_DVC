name: CI_CD_PIPELINE

on:
  push:
    branches:
      - main

jobs:

  project_testing:
    runs-on: ubuntu-latest

    steps:
      - name: checkout-code
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install-dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install "dvc[s3]"
          pip install dagshub

      - name: s3_config
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: pull-data-from-s3
        run: |
          dvc pull

      - name: dagshub-auth
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dagshub login --token "$DAGSHUB_TOKEN"

      - name: dvc-pipeline
        run: |
          dvc repro

      - name: verify-models
        run: |
          echo "Checking trained models..."
          ls -lh models
          test -f models/oe.pkl
          test -f models/model.pkl
          test -f models/trf.pkl
          test -f models/le_pkl.pkl

      - name: upload-project-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project-artifacts
          path: |
            models/
            data/

  backend-testing:
    needs: project_testing
    runs-on: ubuntu-latest

    steps:
      - name: checkout-code
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install-dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: download-project-artifacts
        uses: actions/download-artifact@v4
        with:
          name: project-artifacts
          path: .

      - name: verify-artifacts
        run: |
          echo "Checking data..."
          ls -lh data

          echo "Checking models..."
          ls -lh models

          test -f models/oe.pkl
          test -f models/model.pkl
          test -f models/trf.pkl
          test -f models/le_pkl.pkl

      - name: start-backend
        run: |
          python -m uvicorn backend.app:app \
            --host 127.0.0.1 \
            --port 8002 &

          echo $! > uvicorn.pid

      - name: stop-for-backend
        run: |
          sleep 10

      - name: health-check
        run: |
          curl --fail http://127.0.0.1:8002/health

      - name: stop-backend
        if: always()
        run: |
          kill $(cat uvicorn.pid) || true

  docker-image:
    needs: backend-testing
    runs-on: ubuntu-latest

    steps:
      - name: checkout-code
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: download-project-artifacts
        uses: actions/download-artifact@v4
        with:
          name: project-artifacts
          path: .

      - name: verify-models-before-build
        run: |
          echo "Models available before Docker build:"
          ls -lh models

          test -f models/oe.pkl
          test -f models/model.pkl
          test -f models/trf.pkl
          test -f models/le_pkl.pkl

      - name: build-docker-image
        run: |
          docker build -t uber_image:latest .

      - name: verify-models-inside-image
        run: |
          docker run --rm uber_image:latest \
            ls -lh /app/models

          docker run --rm uber_image:latest \
            test -f /app/models/oe.pkl

      - name: run-docker-container
        run: |
          docker run -d \
            -p 8002:8002 \
            --name uber_container \
            uber_image:latest

      - name: test-container
        run: |
          sleep 10
          curl --fail http://127.0.0.1:8002/health

      - name: delete-container-and-image
        if: always()
        run: |
          docker stop uber_container || true
          docker rm uber_container || true
          docker rmi uber_image:latest || true

  ecr-push:
    needs: docker-image
    runs-on: ubuntu-latest

    steps:
      - name: checkout-code
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: download-project-artifacts
        uses: actions/download-artifact@v4
        with:
          name: project-artifacts
          path: .

      - name: verify-models
        run: |
          ls -lh models

          test -f models/oe.pkl
          test -f models/model.pkl
          test -f models/trf.pkl
          test -f models/le_pkl.pkl

      - name: aws_config
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ECR_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.ECR_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: ecr-login
        run: |
          aws ecr get-login-password \
            --region ap-south-1 | \
          docker login \
            --username AWS \
            --password-stdin \
            577267183471.dkr.ecr.ap-south-1.amazonaws.com

      - name: build-tag-image
        run: |
          docker build -t uber_image:latest .

          docker tag \
            uber_image:latest \
            577267183471.dkr.ecr.ap-south-1.amazonaws.com/uber_dvc:latest

      - name: push-to-ecr
        run: |
          docker push \
            577267183471.dkr.ecr.ap-south-1.amazonaws.com/uber_dvc:latest

  frontend-docker-hub:
    needs: docker-image
    runs-on: ubuntu-latest

    steps:
      - name: checkout-code
        uses: actions/checkout@v4

      - name: docker-login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: build-frontend-image
        working-directory: frontend
        run: |
          docker build -t uber-frontend:latest .

      - name: aws-config
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ECR_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.ECR_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: ecr-login
        run: |
          aws ecr get-login-password \
            --region ap-south-1 | \
          docker login \
            --username AWS \
            --password-stdin \
            577267183471.dkr.ecr.ap-south-1.amazonaws.com

      - name: tag-for-ecr
        run: |
          docker tag \
            uber-frontend:latest \
            577267183471.dkr.ecr.ap-south-1.amazonaws.com/uber-frontend:latest

      - name: push-to-ecr
        run: |
          docker push \
            577267183471.dkr.ecr.ap-south-1.amazonaws.com/uber-frontend:latest