name: CI_CD_PIPELINE

on:
  push:
    branches:
      - main

jobs:

  project_testing:
    runs-on: ubuntu-latest

    steps:
      - name: checkout-code
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install-dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install "dvc[s3]"
          pip install dagshub

      - name: s3_config
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: pull-data-from-s3
        run: |
          dvc pull

      - name: dagshub-auth
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dagshub login --token "$DAGSHUB_TOKEN"

      - name: dvc-pipeline
        run: |
          dvc repro


  backend-testing:
    needs: project_testing
    runs-on: ubuntu-latest

    steps:
      - name: checkout-code
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install-dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[s3]"

      - name: s3_config
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: pull-data-from-s3
        run: |
          dvc pull

      - name: start-backend
        run: |
          python -m uvicorn backend.app:app --host 127.0.0.1 --port 8002 &
          echo $! > uvicorn.pid

      - name: stop-for-backend
        run: |
          sleep 10

      - name: health-check
        run: |
          curl --fail http://127.0.0.1:8002/health

      - name: stop-backend
        if: always()
        run: |
          kill $(cat uvicorn.pid)


  docker-image:
    needs: backend-testing
    runs-on: ubuntu-latest

    steps:
      - name: checkout-code
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      

      - name: install-dependencies
        run: | 
            pip install --upgrade pip
            pip install dvc
            pip install dvc[s3]


      - name: s3_config
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1


      - name: pull-data-from-s3
        run: |
          dvc pull


      - name: build-docker-image
        run: |
          docker build -t uber_image:latest .


      - name: run-docker-container
        run: |
          docker run -d -p 8002:8002 --name uber_container uber_image:latest

      - name: test-container
        run: |
          sleep 10
          curl --fail http://127.0.0.1:8002/health

      - name: delete-container-and-image
        if: always()
        run: |
          docker stop uber_container || true
          docker rm uber_container || true
          docker rmi uber_image:latest || true


  backend-ecr-push:
    needs: docker-image
    runs-on: ubuntu-latest

    steps:
      - name: code-checkout
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
      
      - name: install-dependencies
        run: | 
            pip install --upgrade pip
            pip install dvc
            pip install dvc[s3]

      - name: s3_config
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: pull-data-from-s3
        run: |
          dvc pull

      - name: aws_config
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ECR_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.ECR_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1


      - name: ecr-login
        run: |
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 577267183471.dkr.ecr.ap-south-1.amazonaws.com

      - name: build-tag-image
        run: |
          docker build -t uber_image:latest .
          docker tag uber_image:latest 577267183471.dkr.ecr.ap-south-1.amazonaws.com/uber_dvc:latest

      - name: push-to-ecr
        run: |
          docker push 577267183471.dkr.ecr.ap-south-1.amazonaws.com/uber_dvc:latest
  


  frontend-ecr-push:
    needs: docker-image
    runs-on: ubuntu-latest

    steps:

      - name: checkout-code
        uses: actions/checkout@v4


      - name: aws-config
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ECR_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.ECR_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: ecr-login
        run: |
          aws ecr get-login-password --region ap-south-1 | \
          docker login --username AWS --password-stdin \
          577267183471.dkr.ecr.ap-south-1.amazonaws.com

      - name: tag-for-ecr
        run: |
          docker tag uber-frontend:latest \
          577267183471.dkr.ecr.ap-south-1.amazonaws.com/uber-frontend:latest

      - name: push-to-ecr
        run: |
          docker push \
          577267183471.dkr.ecr.ap-south-1.amazonaws.com/uber-frontend:latest


      
  deploy-ec2:
    needs:
      - backend-ecr-push
      - frontend-ecr-push

    runs-on: ubuntu-latest

    steps:

      - name: configure-aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ECR_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.ECR_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: start-ec2
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          echo "Current EC2 state: $STATE"

          if [ "$STATE" = "stopped" ]; then
            echo "Starting EC2 instance..."

            aws ec2 start-instances \
              --instance-ids "$INSTANCE_ID"

            aws ec2 wait instance-running \
              --instance-ids "$INSTANCE_ID"

            echo "EC2 instance is running."

          elif [ "$STATE" = "running" ]; then
            echo "EC2 instance is already running."

          else
            echo "EC2 is in state: $STATE"
            exit 1
          fi

      - name: wait-for-ssm
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          echo "Waiting for SSM agent..."

          for i in {1..30}; do

            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || true)

            echo "SSM status: $STATUS"

            if [ "$STATUS" = "Online" ]; then
              echo "SSM agent is online."
              exit 0
            fi

            sleep 10

          done

          echo "SSM agent did not become online."
          exit 1

      - name: deploy-containers
        run: |

          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy latest Docker images" \
            --parameters 'commands=[
              "echo Starting deployment...",
              "echo Stopping old containers...",
              "docker rm -f uber-backend 2>/dev/null || true",
              "docker rm -f uber-frontend 2>/dev/null || true",
              "echo Removing old images...",
              "docker rmi -f 577267183471.dkr.ecr.ap-south-1.amazonaws.com/uber_dvc:latest 2>/dev/null || true",
              "docker rmi -f 577267183471.dkr.ecr.ap-south-1.amazonaws.com/uber-frontend:latest 2>/dev/null || true",
              "echo Logging into ECR...",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 577267183471.dkr.ecr.ap-south-1.amazonaws.com",
              "echo Pulling backend image...",
              "docker pull 577267183471.dkr.ecr.ap-south-1.amazonaws.com/uber_dvc:latest",
              "echo Pulling frontend image...",
              "docker pull 577267183471.dkr.ecr.ap-south-1.amazonaws.com/uber-frontend:latest",
              "echo Starting backend container...",
              "docker run -d --name uber-backend --restart unless-stopped -p 8002:8002 577267183471.dkr.ecr.ap-south-1.amazonaws.com/uber_dvc:latest",
              "echo Starting frontend container...",
              "docker run -d --name uber-frontend --restart unless-stopped -p 5174:80 577267183471.dkr.ecr.ap-south-1.amazonaws.com/uber-frontend:latest",
              "echo Containers started.",
              "docker ps"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment..."

          sleep 10

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          echo "Deployment completed."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

      - name: deployment-health-check
        run: |

          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "echo BACKEND HEALTH CHECK",
              "curl --fail http://localhost:8002/health",
              "echo FRONTEND HEALTH CHECK",
              "curl --fail http://localhost:5174/",
              "echo DOCKER CONTAINERS",
              "docker ps"
            ]' \
            --query "Command.CommandId" \
            --output text)

          sleep 10

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text