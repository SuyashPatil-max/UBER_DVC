# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.0-standalone-strict/all.json

apiVersion: apps/v1
kind: Deployment

metadata:
  name:  uber-dvc

spec:
  replicas: 3

  selector:
    matchLabels:
      app:  uber-dvc

  template:
    metadata:
      labels:
        app:  uber-dvc

    spec:
      containers:
        - name:  uber-dvc
          image: uber_image:v1

          resources:
            limits:
              memory: "1024Mi"
              cpu: "500m"

          ports:
            - containerPort: 8002


---


apiVersion: v1
kind: Service

metadata:
  name: uber-dvc-service

spec:
  selector:
    app: uber-dvc

  ports:
    - protocol: TCP
      port: 80
      targetPort: 8002

  type: ClusterIP


---


apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: uber-dvc-ingress

spec:
  rules:
    - host: uber-dvc.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uber-dvc-service
                port:
                  number: 80