# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.0-standalone-strict/all.json

apiVersion: apps/v1
kind: Deployment

metadata:
  name: uber-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: uber-frontend

  template:
    metadata:
      labels:
        app: uber-frontend

    spec:
      imagePullSecrets:
        - name: ecr-secret

      containers:
        - name: uber-frontend

          image: 577267183471.dkr.ecr.ap-south-1.amazonaws.com/uber-frontend:latest
          imagePullPolicy: Always

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "250m"

          ports:
            - containerPort: 80


---


apiVersion: v1
kind: Service

metadata:
  name: uber-frontend-service

spec:
  selector:
    app: uber-frontend

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

  type: ClusterIP


---


apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: uber-frontend-ingress

spec:
  rules:
    - host: uber-frontend.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uber-frontend-service
                port:
                  number: 80